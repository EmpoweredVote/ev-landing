name: Check PostHog analytics coverage

# ev-landing is plain static HTML with no build step, so it can't consume the
# shared @empoweredvote/analytics npm package the React apps use. Instead every
# page loads analytics.js with a single <script src> line in its <head>.
#
# Two src forms are correct, depending on where the page lives:
#
#   - Pages in a subdirectory (briefing/, maps/) MUST use the absolute
#     src="/analytics.js". A relative path there resolves against the page's own
#     directory — /maps/analytics.js — and 404s.
#   - Pages at the repo root MUST use the relative src="analytics.js". Both forms
#     resolve identically on the deploy, so this is not about production: under
#     file:// a root-absolute path resolves to C:/analytics.js, 404s, and leaves
#     `posthog` undefined, so every tracked click throws. That broke the
#     no-page-errors assertion in six Playwright suites, all of which load
#     index.html straight off disk. Requiring the relative form at the root keeps
#     any future page testable the same way.
#
# The depth rule exists because the suites run from file:// with no server. If we
# ever serve them over localhost instead, every page can use the absolute form
# and this whole distinction collapses back to a single grep.
#
# This check fails the build if a page-rendering HTML file is missing that
# include, so "forgot to add tracking on the new page" gets caught at PR time
# instead of being discovered months later. That is exactly how the /maps/
# pages and briefing/index.html ended up dark.
#
# Redirect stubs (meta-refresh pages that immediately bounce to a subdomain
# with its own tracking, e.g. donate.html -> financials.empowered.vote) are
# auto-skipped — they never render, so there is nothing to instrument.
#
# So is anything under tests/ or tools/. Those hold Playwright fixtures and
# generators, not pages a visitor can reach; see the git ls-files line below.
#
# ─────────────────────────────────────────────────────────────────────────────
# THIS CHECK WARNS. IT DOES NOT BLOCK MERGES. That's intentional—for now.
# Chris Andrews, 2026-08-17
#
# If this check shows a warning, the change can still be merged. Our analytics
# setup is currently understood by only a small number of people, so we don't
# want to block someone because they can't fix a warning on their own.
#
# In other words: seeing this warning after a merge is expected. Nothing is broken.
#
# If you see a warning, add the line it asks for, or ask Chris for help.
# If we later want this check to block merges, change it in:
# Repository Settings → Branches → main
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify every page-rendering HTML file includes analytics.js
        run: |
          missing=()
          wrongform=()
          while IFS= read -r -d '' file; do
            # Skip instant-redirect stubs — they never render content.
            if grep -q 'http-equiv="refresh"' "$file"; then
              continue
            fi

            if [ "$(dirname "$file")" = "." ]; then
              # Root-level page: the relative form is required so the page stays
              # loadable from file://.
              if grep -qE 'src="analytics\.js"' "$file"; then
                :
              elif grep -qE 'src="/analytics\.js"' "$file"; then
                wrongform+=("$file")
              else
                missing+=("$file")
              fi
            else
              # Subdirectory page: only the absolute form resolves.
              if grep -qE 'src="/analytics\.js"' "$file"; then
                :
              elif grep -qE 'src="analytics\.js"' "$file"; then
                wrongform+=("$file")
              else
                missing+=("$file")
              fi
            fi
            # Enumerate committed pages via git rather than find: it needs no
            # exclusion list, so node_modules, nested worktrees and scratch files
            # never produce a false failure, and a committed page in a directory
            # nobody thought to exclude still gets checked.
            #
            # tests/ is excluded because a Playwright fixture is not a page. The
            # first one (tests/lines/fixture.html) failed this check on
            # 2026-08-24. Instrumenting it would have been the wrong fix twice
            # over: it would send test traffic to PostHog, and it would give a
            # harness whose entire purpose is to load two files and nothing else
            # a third file plus a network call.
          done < <(git ls-files -z -- '*.html' ':(exclude)tools/*' ':(exclude)tests/*')

          status=0

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::The following page(s) do not load analytics.js:"
            printf '  - %s\n' "${missing[@]}"
            echo ""
            echo 'Add this line to the page'"'"'s <head>, as early as possible.'
            echo 'In a subdirectory, the leading slash is required:'
            echo '    <script src="/analytics.js"></script>'
            echo 'At the repo root, omit it:'
            echo '    <script src="analytics.js"></script>'
            echo ""
            echo 'If a page is intentionally excluded (e.g. a redirect stub), give it an'
            echo 'http-equiv="refresh" meta tag so this check recognizes it, or update the'
            echo 'skip logic in this workflow.'
            status=1
          fi

          if [ "${#wrongform[@]}" -gt 0 ]; then
            echo "::error::The following page(s) load analytics.js with the wrong src form for their location:"
            printf '  - %s\n' "${wrongform[@]}"
            echo ""
            echo 'At the repo root, use the relative form so the page still works'
            echo 'under file:// (where a leading slash resolves off the drive root):'
            echo '    <script src="analytics.js"></script>'
            echo ""
            echo 'In a subdirectory, use the absolute form (a relative src there'
            echo 'resolves against the page'"'"'s own directory and 404s):'
            echo '    <script src="/analytics.js"></script>'
            status=1
          fi

          if [ "$status" -eq 0 ]; then
            echo "All page-rendering HTML files load analytics.js."
          fi

          exit "$status"

      - name: Verify the shared analytics module still initializes PostHog
        run: |
          # Guards against analytics.js being gutted/renamed while every page
          # still "passes" the include check above.
          for needle in "posthog.init(" "posthog.register(" "phEnvironment"; do
            if ! grep -qF "$needle" analytics.js; then
              echo "::error::analytics.js is missing expected code: $needle"
              exit 1
            fi
          done
          echo "analytics.js looks intact."
